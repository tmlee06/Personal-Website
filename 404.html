<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tlee — redirecting…</title>
<meta name="robots" content="noindex">
<script>
    // Maps pretty paths (tlee06.me/logs, tlee06.me/education, ...) to the
    // real file + section on the site. Add new routes here as new sections
    // get added — everything else falls back to the homepage.
    var ROUTES = {
        ""                 : "index.html",
        "home"              : "index.html#home",
        "about"             : "index.html#about",
        "goals"             : "index.html#goals",
        "experience"        : "index.html#experience",
        "education"         : "index.html#education",
        "current-projects"  : "index.html#current-projects",
        "team-projects"     : "index.html#current-projects",
        "projects"          : "index.html#projects",
        "contact"           : "index.html#contact",
        "logs"              : "logs.html",
        "log"               : "logs.html"
    };

    // Normalize: strip leading/trailing slashes, lowercase, drop any query/hash
    var path = window.location.pathname
        .replace(/^\/+|\/+$/g, "")
        .toLowerCase();

    // If the URL has multiple segments (e.g. /logs/travel), only look at
    // the first segment for file routing — but forward a known second
    // segment as a #logs-<category> hash so /logs/travel still lands
    // directly on that category's card in the Logs Wayfinder.
    var segments = path.split("/");
    var firstSegment = segments[0];
    var secondSegment = segments[1];

    var LOG_CATEGORY_SLUGS = ["ucsd", "kyoto", "travel", "reads", "reflections", "thoughts"];

    var destination = ROUTES.hasOwnProperty(firstSegment)
        ? ROUTES[firstSegment]
        : "index.html";

    var hash = "";
    if ((firstSegment === "logs" || firstSegment === "log") && secondSegment) {
        var normalized = secondSegment.toLowerCase();
        if (LOG_CATEGORY_SLUGS.indexOf(normalized) !== -1) hash = "#logs-" + normalized;
    }

    window.location.replace(destination + window.location.search + hash);
</script>
</head>
<body>
    <p>Redirecting… if you're not taken there automatically, <a href="index.html">click here</a>.</p>
</body>
</html>
